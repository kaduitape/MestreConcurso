[project]
name = "mestre-concurso-api"
version = "0.1.0"
description = "Concurso Mestre IA — API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "gunicorn>=23.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.16",
    "asyncmy>=0.2.10",
    "greenlet>=3.1",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    "redis>=5.2",
    "celery[redis]>=5.5",
    "structlog>=25.1",
    "python-multipart>=0.0.20",
    "jinja2>=3.1",
    "aiosmtplib>=4.0",
    "httpx>=0.28",
    "pymupdf>=1.26",
    "qdrant-client>=1.15",
    # OCR opcional: só é usado quando o PDF não tem camada de texto.
    "pytesseract>=0.3.13",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "aiosqlite>=0.21",
    "freezegun>=1.5",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-redis",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["B008", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
# S105 é falso positivo: são nomes de enum/campo, não segredos.
"app/models/token.py" = ["S105"]
"app/models/audit.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]
"app/core/config.py" = ["S105"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
