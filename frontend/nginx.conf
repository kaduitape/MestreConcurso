server {
  listen 80;
  server_name _;

  # DNS interno do Docker. Sem ele, proxy_pass com variável não tem como
  # resolver o nome em tempo de execução. O TTL curto é o que faz o nginx
  # reaprender o IP depois que um contêiner é recriado.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Assets com hash no nome podem ser cacheados agressivamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # In production, the browser reaches the API through the SPA domain.
  # The API and data services remain private in the Docker network.
  location /api/ {
    # O endereço vem de uma VARIÁVEL de propósito. Com o host escrito direto no
    # proxy_pass, o nginx resolve o nome uma única vez, ao subir, e guarda o IP
    # para sempre. Quando o deploy recria só o contêiner da API, ela volta com
    # outro IP na rede do Docker e o nginx continua falando com o endereço
    # morto: todo /api/ passa a responder 502, com corpo HTML — que o frontend
    # não consegue ler como erro e vira "não foi possível concluir a operação".
    # Com variável, o nome é resolvido a cada requisição, pelo DNS do Docker.
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # End-to-end health check used by the VPS and its reverse proxy.
  # É este o caminho que o deploy precisa testar: ele atravessa o nginx, então
  # pega tanto API fora do ar quanto proxy apontando para o lugar errado.
  location = /health {
    set $api_health http://api:8000;
    proxy_pass $api_health/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota desconhecida devolve o index.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
