name: Deploy VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Validar configuração do deploy
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_APP_DIR"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"

      - name: Configurar acesso SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar aplicação e containers
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -eu
          test -n "$VPS_APP_DIR"
          test -d "$VPS_APP_DIR/.git"
          cd "$VPS_APP_DIR"

          # Falha se alguém editou arquivos diretamente na VPS. O deploy nunca
          # descarta mudanças locais silenciosamente.
          test -z "$(git status --porcelain)"
          git fetch --prune origin master
          git checkout master
          git pull --ff-only origin master

          compose="docker compose --env-file .env -f docker-compose.yml -f docker-compose.production.yml"
          $compose config -q
          $compose up -d --build --remove-orphans

          # As migrations NÃO são disparadas daqui. O entrypoint do contêiner já
          # roda `alembic upgrade head` antes de subir o gunicorn, e `up -d`
          # retorna quando o contêiner inicia, não quando o entrypoint termina:
          # disparar de novo aqui colocava dois alembic correndo no mesmo banco.
          # Em MySQL o DDL não tem rollback, então o perdedor da corrida deixava
          # a tabela criada sem o carimbo de versão. O /health só responde depois
          # das migrations, então esperar por ele é esperar por elas.
          # Todo `compose exec` abaixo fecha o stdin com `</dev/null`, e isso NÃO
          # é adorno: este script inteiro chega no servidor pelo stdin do
          # `bash -s`. O `compose exec` conecta o stdin ao processo remoto mesmo
          # com `-T`, então quando ele drena o que sobrou do heredoc, o resto do
          # script simplesmente desaparece e o passo termina com sucesso sem ter
          # executado as checagens. É uma corrida: um deploy passou por sorte e
          # o seguinte morreu logo depois do `up -d`.

          # 1) A API por dentro. Prova que as migrations rodaram e o app subiu.
          api_ok=0
          for attempt in $(seq 1 60); do
            if $compose exec -T api curl -fsS http://localhost:8000/health </dev/null >/dev/null 2>&1; then
              api_ok=1
              break
            fi
            sleep 2
          done
          if [ "$api_ok" != "1" ]; then
            echo "[deploy] a API não respondeu em 120s; logs do api abaixo"
            $compose logs --tail=300 api
            exit 1
          fi
          echo "[deploy] API respondeu por dentro"

          # 2) O caminho que o usuário realmente usa: navegador -> nginx -> API.
          # Checar só a API por dentro deixa passar um proxy apontando para um
          # contêiner que não existe mais: o deploy fica verde e todo /api/
          # responde 502 em produção. Já aconteceu — por isso este passo existe.
          for attempt in $(seq 1 30); do
            if $compose exec -T frontend wget -qO- http://127.0.0.1/health </dev/null >/dev/null 2>&1; then
              echo "[deploy] /health pelo nginx respondeu — caminho do usuário OK"
              $compose ps
              exit 0
            fi
            sleep 2
          done

          echo "[deploy] a API responde por dentro, mas /health pelo nginx não."
          echo "[deploy] o proxy do frontend não está alcançando a API."
          $compose logs --tail=100 frontend
          $compose ps
          exit 1
          REMOTE
