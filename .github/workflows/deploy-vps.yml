name: Deploy VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Validar configuração do deploy
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_APP_DIR"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"

      - name: Configurar acesso SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar aplicação e containers
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -eu
          test -n "$VPS_APP_DIR"
          test -d "$VPS_APP_DIR/.git"
          cd "$VPS_APP_DIR"

          # Falha se alguém editou arquivos diretamente na VPS. O deploy nunca
          # descarta mudanças locais silenciosamente.
          test -z "$(git status --porcelain)"
          git fetch --prune origin master
          git checkout master
          git pull --ff-only origin master

          compose="docker compose --env-file .env -f docker-compose.yml -f docker-compose.production.yml"
          $compose config -q
          $compose up -d --build --remove-orphans

          # As migrations NÃO são disparadas daqui. O entrypoint do contêiner já
          # roda `alembic upgrade head` antes de subir o gunicorn, e `up -d`
          # retorna quando o contêiner inicia, não quando o entrypoint termina:
          # disparar de novo aqui colocava dois alembic correndo no mesmo banco.
          # Em MySQL o DDL não tem rollback, então o perdedor da corrida deixava
          # a tabela criada sem o carimbo de versão. O /health só responde depois
          # das migrations, então esperar por ele é esperar por elas.
          # Todo `compose exec` abaixo fecha o stdin com `</dev/null`, e isso NÃO
          # é adorno: este script inteiro chega no servidor pelo stdin do
          # `bash -s`. O `compose exec` conecta o stdin ao processo remoto mesmo
          # com `-T`, então quando ele drena o que sobrou do heredoc, o resto do
          # script simplesmente desaparece e o passo termina com sucesso sem ter
          # executado as checagens. É uma corrida: um deploy passou por sorte e
          # o seguinte morreu logo depois do `up -d`.

          # 1) A API por dentro. Prova que as migrations rodaram e o app subiu.
          api_ok=0
          for attempt in $(seq 1 60); do
            if $compose exec -T api curl -fsS http://localhost:8000/health </dev/null >/dev/null 2>&1; then
              api_ok=1
              break
            fi
            sleep 2
          done
          if [ "$api_ok" != "1" ]; then
            echo "[deploy] a API não respondeu em 120s; logs do api abaixo"
            $compose logs --tail=300 api
            exit 1
          fi
          echo "[deploy] API respondeu por dentro"

          # 1.1) O carimbo de versão precisa estar na cabeça.
          # Um deploy já ficou verde com o schema novo carimbado na revisão
          # anterior: o Alembic rodou o DDL e não confirmou o carimbo, e quem
          # quebrou foi o deploy SEGUINTE, repetindo uma migração que já tinha
          # rodado. A causa está corrigida; esta checagem é o alarme.
          versao=$($compose exec -T api alembic current </dev/null 2>/dev/null | tail -n 1 || true)
          if [ -z "$versao" ]; then
            echo "[deploy] aviso: não consegui ler a versão do banco; seguindo"
          elif echo "$versao" | grep -q '(head)'; then
            echo "[deploy] banco na cabeça das migrations: $versao"
          else
            echo "[deploy] o banco NÃO está na cabeça das migrations: $versao"
            echo "[deploy] o schema pode ter subido sem o carimbo — ver docs/30."
            $compose logs --tail=100 api
            exit 1
          fi

          # 1.2) A credencial restrita do analista de melhorias (Agente 8).
          # Só roda quando as duas variáveis estão no .env: é assim que o
          # operador liga o isolamento. É idempotente e vem depois das
          # migrations de propósito — a concessão é por tabela, e as tabelas
          # precisam existir. Se falhar, o deploy segue: a aplicação detecta e
          # diz no painel que a garantia é só do código, em vez de fingir um
          # isolamento que não existe.
          #
          # O SQL entra por PIPE, não por heredoc. Heredoc aninhado seria lido
          # do mesmo stdin que carrega este script (ver o aviso acima sobre
          # `compose exec` drenando o heredoc) e o resto do deploy desapareceria
          # sem erro. A senha vai por variável de ambiente, nunca por argumento:
          # argumento de processo é legível por qualquer um na máquina.
          ro_user=$(sed -n 's/^MYSQL_READONLY_USER=//p' .env | head -1 | tr -d "\"' ")
          ro_pass=$(sed -n 's/^MYSQL_READONLY_PASSWORD=//p' .env | head -1 | tr -d "\"' ")
          db_name=$(sed -n 's/^MYSQL_DATABASE=//p' .env | head -1 | tr -d "\"' ")
          root_pass=$(sed -n 's/^MYSQL_ROOT_PASSWORD=//p' .env | head -1 | tr -d "\"' ")
          [ -n "$db_name" ] || db_name=mestre_concurso
          if [ -n "$ro_user" ] && [ -n "$ro_pass" ] && [ -n "$root_pass" ]; then
            grant_sql=$(printf '%s\n' \
              "CREATE USER IF NOT EXISTS '$ro_user'@'%' IDENTIFIED BY '$ro_pass';" \
              "ALTER USER '$ro_user'@'%' IDENTIFIED BY '$ro_pass';" \
              "GRANT SELECT ON \`$db_name\`.* TO '$ro_user'@'%';" \
              "GRANT INSERT, UPDATE ON \`$db_name\`.improvement_findings TO '$ro_user'@'%';" \
              "GRANT INSERT, UPDATE ON \`$db_name\`.improvement_detector_settings TO '$ro_user'@'%';" \
              "FLUSH PRIVILEGES;")
            if printf '%s\n' "$grant_sql" | $compose exec -T -e MYSQL_PWD="$root_pass" \
              mysql mysql -uroot "$db_name" >/dev/null 2>&1; then
              echo "[deploy] credencial restrita do analista: concessão em dia"
            else
              echo "[deploy] aviso: não consegui manter a credencial restrita do analista."
              echo "[deploy] ele vai reportar isolamento apenas por código no painel."
            fi
          else
            echo "[deploy] sem MYSQL_READONLY_USER/PASSWORD no .env: o analista roda"
            echo "[deploy] sem credencial restrita, e o painel diz isso."
          fi

          # 2) O caminho que o usuário realmente usa: navegador -> nginx -> API.
          # Checar só a API por dentro deixa passar um proxy apontando para um
          # contêiner que não existe mais: o deploy fica verde e todo /api/
          # responde 502 em produção. Já aconteceu — por isso este passo existe.
          #
          # O Host precisa ser o de verdade: a API roda com TrustedHostMiddleware
          # e responde 400 "Invalid host header" para qualquer outro. Sai do
          # ALLOWED_HOSTS do .env, que é exatamente o que produção aceita.
          health_host=$(sed -n 's/^ALLOWED_HOSTS=//p' .env | head -1 | cut -d, -f1 | tr -d "\"' ")
          [ -n "$health_host" ] || health_host=localhost
          echo "[deploy] testando o caminho do usuário com Host: $health_host"
          for attempt in $(seq 1 30); do
            if $compose exec -T frontend wget -qO- --header="Host: $health_host" http://127.0.0.1/health </dev/null >/dev/null 2>&1; then
              echo "[deploy] /health pelo nginx respondeu — caminho do usuário OK"
              $compose ps
              exit 0
            fi
            sleep 2
          done

          echo "[deploy] a API responde por dentro, mas /health pelo nginx não."
          echo "[deploy] 502 = o proxy não alcança a API; 400 = Host recusado."
          $compose exec -T frontend wget -S -qO- --header="Host: $health_host" \
            http://127.0.0.1/health </dev/null 2>&1 | head -20 || true
          $compose logs --tail=100 frontend
          $compose ps
          exit 1
          REMOTE
