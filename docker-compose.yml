name: mestre-concurso

x-backend-env: &backend-env
  ENVIRONMENT: development
  DEBUG: "true"
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_DATABASE: ${MYSQL_DATABASE:-mestre_concurso}
  MYSQL_USER: ${MYSQL_USER:-mestre}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
  SMTP_HOST: mailhog
  SMTP_PORT: 1025
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@mestreconcurso.com.br}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@Mestre123}
  STORAGE_LOCAL_PATH: /var/lib/mestre/uploads
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mestre_concurso}
      MYSQL_USER: ${MYSQL_USER:-mestre}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-dev}
    command: ["api-reload"]
    environment: *backend-env
    volumes:
      - uploads_data:/var/lib/mestre/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-dev}
    command: ["worker"]
    environment:
      <<: *backend-env
      RUN_SEED: "false"
      CELERY_QUEUES: default,notifications,documents
      CELERY_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - uploads_data:/var/lib/mestre/uploads
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-dev}
    command: ["beat"]
    environment:
      <<: *backend-env
      RUN_SEED: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: ${FRONTEND_TARGET:-dev}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_APP_NAME: ${VITE_APP_NAME:-Game of Concursos}
    depends_on:
      - api
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  qdrant_data:
