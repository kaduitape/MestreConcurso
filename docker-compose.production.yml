# Sobreposição usada exclusivamente na VPS. Nunca execute junto do override de
# desenvolvimento, que monta o código local e habilita recarga automática.
services:
  api:
    build:
      target: runtime
    command: ["api"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      RUN_SEED: "true"

  worker:
    build:
      target: runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  beat:
    build:
      target: runtime
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  frontend:
    build:
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:?defina a URL pública da API no .env da VPS}
    environment: !reset []
    ports: !reset
      - "${FRONTEND_PORT:-80}:80"
